<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Walker General Contractors</title>
    
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "GeneralContractor",
      "name": "Walker General Contractors",
      "image": "https://generalcontractorsvancouver.ca/logo.jpg",
      "@id": "",
      "url": "https://generalcontractorsvancouver.ca",
      "telephone": "+16045550198",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "123 Construction Way",
        "addressLocality": "Vancouver",
        "addressRegion": "BC",
        "postalCode": "V5K 0A1",
        "addressCountry": "CA"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 49.2827,
        "longitude": -123.1207
      },
      "knowsLanguage": ["en", "fr", "es", "pa", "zh"]
    }
    </script>
    
    <!-- Google Translate Script for actual visible translation -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'en,fr,es,pa,zh-CN,zh-TW',
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    
    <style>
      /* Hide the annoying top bar Google Translate adds */
      .skiptranslate iframe { display: none !important; }
      body { top: 0 !important; }
      /* Style the translate widget container */
      #google_translate_element select {
        background-color: #f8fafc;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        padding: 4px 8px;
        font-size: 14px;
        color: #334155;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
