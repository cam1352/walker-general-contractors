<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Walker General Contractors | Premium Custom Builders & Renovations</title>`n    <meta name="description" content="Award-winning general contractor specializing in luxury custom homes, major renovations, and commercial construction. Fully licensed, WorkSafeBC compliant, and BBB A+ accredited.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
      <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "GeneralContractor",
      "name": "Walker General Contractors",
      "image": "https://generalcontractorsvancouver.ca/logo.jpg",
      "@id": "",
      "url": "https://generalcontractorsvancouver.ca",
      "telephone": "+16045550198",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "123 Construction Way",
        "addressLocality": "Vancouver",
        "addressRegion": "BC",
        "postalCode": "V5K 0A1",
        "addressCountry": "CA"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 49.2827,
        "longitude": -123.1207
      },
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": [
          "Monday",
          "Tuesday",
          "Wednesday",
          "Thursday",
          "Friday"
        ],
        "opens": "07:00",
        "closes": "18:00"
      },
      "knowsLanguage": ["en", "fr", "es", "pa", "zh"]
    }
    </script>
</head>
  <body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-amber-500 selection:text-slate-950">
    <!-- A hidden form for Netlify to parse the React form fields -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="phone" />
      <input type="text" name="projectType" />
      <textarea name="message"></textarea>
      <input type="text" name="estimatedCost" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
